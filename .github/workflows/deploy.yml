name: Validate and deploy website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check nav.js
          node --check theme-init.js
      - name: Validate and stage public files
        run: python scripts/build_site.py
      - name: Install browser test dependencies
        run: |
          python -m pip install -r scripts/browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check responsive layouts and interactions
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/site-preview.log 2>&1 &
          python scripts/check_browser.py --screenshots /tmp/site-screenshots
      - name: Retain visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: /tmp/site-screenshots
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
